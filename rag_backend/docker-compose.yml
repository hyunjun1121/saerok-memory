services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/haru-demo-password
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/data/haru.db
      SEED_JSON_PATH: /app/data/haru_7day_admin_usage_records.json
      EMBEDDING_MODEL_PATH: /app/models/multilingual-e5-small
      EMBEDDING_MODEL_REVISION: 614241f622f53c4eeff9890bdc4f31cfecc418b3
      NEO4J_ENABLED: "true"
      NEO4J_URI: bolt://neo4j:7687
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j_data:
