<script>
(function(){
  var stage=document.getElementById('stage'), frame=document.getElementById('frame');
  function fit(){
    var s=Math.min(1,(window.innerWidth-32)/600);
    stage.style.transform='scale('+s+')';
    frame.style.width=(600*s)+'px'; frame.style.height=(1800*s)+'px';
  }
  fit(); window.addEventListener('resize',fit);
  var photo=document.getElementById('photo'), file=document.getElementById('file');
  photo.addEventListener('click',function(){file.click()});
  file.addEventListener('change',function(){
    var f=file.files&&file.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(){photo.style.backgroundImage='url("'+r.result+'")'};
    r.readAsDataURL(f);
  });
})();
</script>
